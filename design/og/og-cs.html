<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
  /* The site's own typeface, from public/fonts (serve the repository root over HTTP, see README.md) */
  @font-face { font-family: Archivo; font-weight: 100 900; font-stretch: 62% 125%; src: url(../../public/fonts/archivo-latin-ext-wdth-normal.woff2) format("woff2-variations"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20C0; }
  @font-face { font-family: Archivo; font-weight: 100 900; font-stretch: 62% 125%; src: url(../../public/fonts/archivo-latin-wdth-normal.woff2) format("woff2-variations"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #F4F5F2; color: #0B1220; font-family: Archivo, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { position: absolute; inset: 60px 72px 52px; display: flex; flex-direction: column; }
  .logo { height: 44px; width: auto; align-self: flex-start; }
  h1 { margin: auto 0 0; font-size: 84px; font-weight: 640; font-stretch: 78%; line-height: .98; letter-spacing: -.012em; }
  .foot { display: flex; align-items: baseline; justify-content: space-between; margin-top: 44px; padding-top: 22px; border-top: 2px solid #0B1220; font-size: 25px; font-weight: 600; font-stretch: 88%; }
  .services { display: flex; gap: 44px; }
  .url { font-weight: 500; color: #5B6474; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="../../public/brand/logo.svg" alt="">
    <h1>Stavíme AI systémy a software.<br>A pak se je snažíme prolomit.</h1>
    <div class="foot">
      <div class="services"><span>AI řešení</span><span>Vývoj softwaru</span><span>Bezpečnost</span></div>
      <div class="url">www.sivak.ai</div>
    </div>
  </div>
</body>
</html>
