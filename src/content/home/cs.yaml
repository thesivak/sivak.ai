ratio:
  id: pravidlo-80-20
  eyebrow: Pravidlo 80:20
  title: Nejdřív rutina. Tam se AI zaplatí nejrychleji.
  text: "Rutina u počítače zabírá většinu pracovní doby a přináší nejméně: přepisování dat, kontroly, dohledávání, pořád stejné odpovědi. Právě tu převezmou agenti jako první. Vašim lidem zůstane 20 % práce, která přináší 80 % výsledků."
  routine:
    share: 80 %
    label: Rutina, kterou převezmou agenti
    items:
      - třídění e-mailů
      - přepisování dat mezi systémy
      - kontrola faktur a dokumentů
      - odpovědi na opakované dotazy
      - dohledávání informací
      - reporty a přehledy
      - testování a kontrola kvality
  people:
    share: 20 %
    label: Zůstane vašim lidem
    items:
      - rozhodování
      - vztahy se zákazníky
      - nápady a rozvoj firmy
services:
  id: sluzby
  eyebrow: Co děláme
  title: Agenty postavíme, nasadíme i provozujeme
  lead: Neprodáváme obecného chatbota. Stavíme řešení na konkrétní práci ve vaší firmě a staráme se o něj i po spuštění.
  items:
    - title: AI agenti v týmu
      text: Digitální kolegové na konkrétní práci. Vyřizují požadavky, kontrolují dokumenty a testují software. Agent připraví, člověk rozhodne.
      tags:
        - zákaznická podpora
        - kontrola dokumentů
        - testování aplikací
      more:
        label: Více o AI agentech
        href: /ai-agenti
    - title: AI nad vašimi daty
      text: Napojíme AI na ERP, CRM i tabulky. Zeptáte se běžnou větou a dostanete odpověď s čísly.
      tags:
        - přehledy pro vedení
        - hledání ve smlouvách
        - upozornění na odchylky
    - title: Automatizace procesů
      text: Propojíme systémy, které spolu nemluví. Data se přenesou sama, bez přepisování z jednoho okna do druhého.
      tags:
        - e-mail → ERP
        - e-shop → účetnictví
        - CRM → fakturace
      more:
        label: Více o automatizaci
        href: /ai-automatizace
    - title: Roboti pro starý software
      text: Obsluhují programy bez API – Helios, DOSové aplikace i interní systémy, které nikdo nechce přepisovat.
      tags:
        - práce přes obrazovku
        - bez zásahu do systému
        - ve dne i v noci
  training:
    label: AI školení pro firmy
    title: Jednodenní AI školení pro váš tým
    text: Praktický den s ChatGPT a dalšími AI nástroji, automatizacemi a AI agenty. 35 000 Kč za jednodenní školení pro vaši firmu.
    cta: Více o školení
    href: /ai-skoleni
useCases:
  id: priklady
  eyebrow: Kde agenti pomáhají
  title: Agent zvládne práci, kterou dnes děláte u počítače
  lead: Pracuje v aplikacích stejně jako člověk. Čte e-maily a dokumenty, vyplňuje formuláře, kliká v systémech a hotovou práci předá ke kontrole.
  outputLabel: Výstup
  items:
    - area: Vedení firmy
      text: Roztřídí e-maily, shrne důležitá vlákna a každé ráno připraví přehled z ERP a CRM.
      output: ranní přehled
    - area: Výroba
      text: Rozvrhne zakázky podle objednávek, ohlídá materiál na skladě a připraví poptávky.
      output: plán výroby
    - area: Marketing
      text: Stáhne data z kampaní, porovná je s cíli a připraví reporty pro klienty.
      output: report pro klienta
    - area: Zákaznická podpora
      text: Prošetří požadavek, dohledá historii zákazníka a připraví odpověď.
      output: návrh odpovědi
    - area: Účetnictví
      text: Vytěží přijaté faktury, zkontroluje je a spáruje s objednávkami i platbami.
      output: doklady k zaúčtování
    - area: Obchod
      text: Doplní kontakty do CRM, připraví podklady k nabídce a pohlídá, komu se ozvat.
      output: úkoly na dnešek
    - area: Nákup a sklad
      text: Porovná nabídky dodavatelů a hlídá zásoby i termíny dodávek.
      output: návrh objednávky
    - area: Vývoj softwaru
      text: Otestuje novou verzi aplikace v prohlížeči a výsledek doloží videem.
      output: zpráva o testu
  more: Nevidíte tu svou práci? Pokud se dělá u počítače, agent ji nejspíš zvládne.
  moreLink: Probereme to
process:
  id: postup
  eyebrow: Jak to probíhá
  title: Od první schůzky k agentovi v provozu
  lead: Začínáme malým krokem s jasným výsledkem. Rozšiřujeme, až když se agent osvědčí.
  outputLabel: Výstup
  steps:
    - title: Úvodní schůzka
      text: Projdeme vaše procesy a najdeme rutinu, která zabírá nejvíc času.
      output: vhodné procesy
    - title: Výpočet návratnosti
      text: Spočítáme, kolik hodin agent ušetří a kdy se investice vrátí. Víte to dřív, než začneme.
      output: odhad úspory
    - title: Pilotní projekt
      text: Postavíme agenta na jeden proces. Vaši lidé kontrolují jeho práci a my měříme výsledky.
      output: agent v provozu
    - title: Provoz a rozšíření
      text: Agenta provozujeme, hlídáme a zlepšujeme. Když se osvědčí, převezme další práci.
      output: přehled odvedené práce
  more:
    label: Jak probíhá pilotní projekt
    href: /pilotni-projekt
deployment:
  id: nasazeni
  eyebrow: Kde agenti běží
  title: V cloudu i na vašem hardwaru
  lead: Kde agenti poběží, rozhodnete vy. Pokud data nesmí opustit firmu, nasadíme je na váš server s lokálními AI modely – fungují i úplně bez přístupu k internetu.
  options:
    - title: Cloudová řešení
      text: Agenti využívají nejvýkonnější AI modely v cloudu. Nepotřebujete vlastní hardware, takže začnete rychleji.
      specs:
        - [ model, nejvýkonnější cloudové modely ]
        - [ hardware, není potřeba ]
        - [ start, nejrychlejší ]
      fit: Pro rychlý start a nejvyšší výkon.
      badge: ""
      highlight: false
    - title: Na vašem hardwaru
      text: Agenti i AI modely běží na serveru ve vaší firmě. Data nikdy neopustí vaši síť a vše funguje i bez přístupu k internetu.
      specs:
        - [ model, "lokální, běží u vás" ]
        - [ data, neopustí firmu ]
        - [ internet, není potřeba ]
      fit: Pro citlivá data, výrobu a uzavřené sítě.
      badge: i bez internetu
      highlight: true
control:
  id: bezpecnost
  eyebrow: Pod kontrolou
  title: Agent připraví. Člověk rozhodne.
  lead: Agenti pracují v jasných mantinelech. Vždy víte, co dělají, k čemu mají přístup a proč došli k výsledku.
  manifest:
    label: Ukázka oprávnění agenta
    file: agent-fakturace.yaml
    agent:
      - agent
      - fakturace
    accessKey: přístup
    access:
      - [ e-mail faktury@, čtení ]
      - [ účetní systém, "čtení, návrh zápisu" ]
      - [ banka, čtení ]
    rest:
      - [ schvaluje, účetní ]
      - [ hesla, spravuje systém ]
      - [ záznam, každý krok ]
  items:
    - title: Schvaluje člověk
      text: Důležité kroky, jako odpověď zákazníkovi, zaúčtování nebo objednávku, vždy potvrdí člověk.
    - title: Jen nutná oprávnění
      text: Agent dostane přístup jen k tomu, co ke své práci potřebuje. Většinou jen ke čtení.
    - title: Hesla nevidí
      text: Přístupové údaje spravuje systém. Agent je nikdy nedostane do rukou.
    - title: Zkouší na kopii
      text: Testuje a zkouší na kopii dat. Ostrý provoz zůstává nedotčený.
    - title: Záznam každého kroku
      text: Každá akce je zaznamenaná, včetně snímků obrazovky a videa. Víte, co agent udělal a proč.
    - title: Měřitelný výsledek
      text: Vidíte, kolik práce agent odvedl a kolik času vám ušetřil.
case:
  id: z-praxe
  eyebrow: Z praxe
  title: Tým AI agentů pro softwarovou firmu
  lead: Pro softwarovou firmu provozujeme agenty, kteří každý den pracují vedle lidí z podpory, testování a vývoje.
  status: v provozu
  agents:
    - name: Zákaznická podpora
      text: Prošetří každý nový požadavek. Přečte historii zákazníka, ověří data v aplikaci a připraví odpověď. Odesílá ji člověk.
      meta: nové požadavky kontroluje každých 10 minut
    - name: Testování
      text: Novou verzi aplikace vyzkouší ve skutečném prohlížeči jako tester. Výsledek doloží snímky obrazovky a videem.
      meta: "výsledek: prošlo / neprošlo / nelze ověřit"
    - name: Vývoj a kontrola kódu
      text: Podle zadání připraví změnu v kódu a nezávislý agent ji zkontroluje. Schvaluje a nasazuje člověk.
      meta: mimo ostrý provoz
    - name: Studio pro kolegy
      text: Kolegové, kteří neprogramují, popíšou nápad a hned ho vidí v aplikaci. Vývojářům předají hotový návrh.
      meta: od nápadu k návrhu bez programování
  facts:
    - Do firemních systémů jen ke čtení
    - Každý krok zaznamenaný
    - Běží ve dne i v noci
