audience:
  id: pro-koho
  eyebrow: Pro koho
  title: Pro každého, kdo pracuje u počítače
  lead: Školení vedeme pro jednu skupinu i pro celou firmu. Příklady a cvičení vybíráme podle toho, kdo bude v místnosti.
  items:
    - title: Zaměstnanci
      text: Asistentky, HR, obchod, účetnictví, marketing. Naučí se používat AI na každodenní práci – e-maily, dokumenty, tabulky, shrnutí a rešerše – a poznat, kdy výsledku nevěřit.
    - title: Management
      text: Vedoucí týmů a oddělení. Kde AI týmu ušetří čas, jak nastavit pravidla jejího používání a jak kontrolovat, co AI připraví.
    - title: CEO a vedení firmy
      text: Majitelé a ředitelé. Co AI dnes opravdu zvládne, kde se ve firmě vyplatí nejdřív a co znamenají AI agenti pro chod firmy.
  note: Smíšená skupina je v pořádku – program sestavíme tak, aby si odnesl každý.

program:
  id: program
  eyebrow: Program dne
  title: Co se váš tým za jeden den naučí
  lead: Málo teorie, hodně práce na příkladech z vaší firmy. Každý si nástroje vyzkouší sám.
  parts:
    - label: Dopoledne
      blocks:
        - title: Jak AI funguje a co od ní čekat
          text: Přehled nástrojů a jejich rozdílů, bez technického žargonu.
          points:
            - ChatGPT, Claude, Gemini a Microsoft Copilot
            - co AI umí dobře a kde chybuje
            - proč si AI někdy vymýšlí a jak to poznat
        - title: Prompting v praxi
          text: Jak zadávat úkoly, aby výsledek seděl napoprvé.
          points:
            - kontext, role, příklady a formát výstupu
            - práce s dokumenty, tabulkami a delšími texty
            - vlastní knihovna osvědčených zadání
        - title: AI na vaší každodenní práci
          text: Ukázky a cvičení na úlohách, které účastníci řeší každý den.
          points:
            - e-maily, zápisy z porad, shrnutí a překlady
            - podklady, přehledy a rešerše pro vedení
            - inzeráty, interní komunikace a dokumenty pro HR
    - label: Odpoledne
      blocks:
        - title: Bezpečnost a firemní pravidla
          text: Jak s AI pracovat, aby firemní a osobní data zůstala v bezpečí.
          points:
            - jaká data do AI nepatří
            - osobní údaje, GDPR a firemní účty
            - návrh jednoduchých pravidel používání AI ve firmě
        - title: Úvod do AI agentů a automatizace
          text: Co přijde po chatu – agenti, kteří převezmou rutinní práci u počítače.
          points:
            - rozdíl mezi chatem a AI agentem
            - ukázky agentů z naší praxe
            - agent připraví, člověk rozhodne
        - title: Workshop na vašich úlohách a otázky
          text: Účastníci si AI vyzkouší na vlastní práci a ptají se na cokoli.
          points:
            - řešení konkrétních úloh účastníků
            - otázky a odpovědi
            - doporučení, kde ve firmě začít
  note: Orientační program. Před školením ho upravíme podle vaší firmy, složení skupiny a nástrojů, které používáte.

trainer:
  id: lektor
  eyebrow: Kdo školí
  title: Školí někdo, kdo AI agenty sám staví
  name: Miroslav Sivák
  role: Founder & CEO, sivak.ai
  bio:
    - Mirek vede sivak.ai – firmu, která pro české firmy staví AI agenty na práci u počítače, nasazuje je a provozuje. Pro softwarovou firmu například provozuje agenty, kteří připravují odpovědi zákaznické podpory a testují nové verze aplikace.
    - Na školení proto neukazuje teorii z prezentací, ale postupy, které se osvědčily v provozu. A stejně otevřeně mluví o tom, kde má AI své limity a kde musí rozhodnout člověk.
  facts:
    - Founder & CEO sivak.ai
    - Staví a provozuje AI agenty pro firmy
    - Agenti v cloudu i na vlastním serveru firmy
    - "Zásada: agent připraví, člověk rozhodne"
