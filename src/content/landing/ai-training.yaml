audience:
  id: who-its-for
  eyebrow: Who it's for
  title: For everyone who works at a computer
  lead: We run the training for a single team or the whole company, and choose the examples and exercises based on who will be in the room.
  items:
    - title: Employees
      text: Assistants, HR, sales, accounting, marketing. They learn to use AI for everyday work – emails, documents, spreadsheets, summaries and research – and to spot when not to trust the result.
    - title: Managers
      text: Team and department leads. Where AI saves the team time, how to set rules for using it, and how to check what AI prepares.
    - title: CEOs and leadership
      text: Owners and directors. What AI can really do today, where it pays off first in the company, and what AI agents mean for how the business runs.
  note: A mixed group is fine – we put the program together so that everyone takes something away.

program:
  id: program
  eyebrow: The day's program
  title: What your team will learn in one day
  lead: From ChatGPT through automation to AI agents. Little theory, lots of work on examples from your company – everyone tries the tools for themselves.
  parts:
    - label: Morning
      blocks:
        - title: How AI works and what to expect from it
          text: An overview of the tools and how they differ, without technical jargon.
          points:
            - ChatGPT, Claude, Gemini and Microsoft Copilot
            - what AI does well and where it gets things wrong
            - why AI sometimes makes things up and how to tell
        - title: Prompting in practice
          text: How to give AI tasks so the result is right the first time.
          points:
            - context, role, examples and output format
            - working with documents, spreadsheets and longer texts
            - your own library of proven prompts
        - title: AI in your everyday work
          text: Demos and exercises on tasks the participants deal with every day.
          points:
            - emails, meeting notes, summaries and translations
            - briefings, overviews and research for management
            - job ads, internal communication and HR documents
    - label: Afternoon
      blocks:
        - title: Security and company rules
          text: How to work with AI so that company and personal data stay safe.
          points:
            - what data does not belong in AI
            - personal data, GDPR and company accounts
            - drafting simple rules for using AI in the company
        - title: Introduction to AI agents and automation
          text: What comes after chat – agents that take over routine computer work.
          points:
            - the difference between a chat and an AI agent
            - which routine tasks can be automated
            - examples of agents from our own work
            - the agent prepares, a person decides
        - title: Workshop on your tasks, and Q&A
          text: Participants try AI on their own work and ask about anything.
          points:
            - working through participants' real tasks
            - questions and answers
            - where to start in your company to get ahead of the competition
  note: An indicative program. Before the training we tailor it to your company, the make-up of the group and the tools you use.

