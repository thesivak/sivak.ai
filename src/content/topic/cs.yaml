        lead: Rutina, kterou převezmou agenti. Vašim lidem zůstane 20 % práce, která přináší 80 % výsledků.
        tags:
          - třídění e-mailů
          - přepisování dat mezi systémy
          - kontrola faktur a dokumentů
          - odpovědi na opakované dotazy
          - dohledávání informací
          - reporty a přehledy
          - testování a kontrola kvality
