        lead: Agenti pracují v jasných mantinelech. Vždy víte, co dělají, k čemu mají přístup a proč došli k výsledku.
        items:
          - title: Jen nutná oprávnění
            text: Agent dostane přístup jen k tomu, co ke své práci potřebuje. Většinou jen ke čtení.
          - title: Hesla nevidí
            text: Přístupové údaje spravuje systém. Agent je nikdy nedostane do rukou.
          - title: Zkouší na kopii
            text: Testuje a zkouší na kopii dat. Ostrý provoz zůstává nedotčený.
          - title: Záznam každého kroku
            text: Každá akce je zaznamenaná, včetně snímků obrazovky a videa. Víte, co agent udělal a proč.
